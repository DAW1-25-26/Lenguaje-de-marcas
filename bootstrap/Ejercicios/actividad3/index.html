<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>actividad3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-12 bg-primary" style="height: 60px;"></div>
        </div>
        <div class="row">
            <div class="col-4 bg-danger">
                <div class="bg-danger" style="height: 120px;"></div>
            </div>
            <div class="col-8">
                <div class="row">
                    <div class="col-4 bg-dark" style="height: 60px;"></div>
                    <div class="col-4 bg-success" style="height: 60px;"></div>
                    <div class="col-4 bg-dark" style="height: 60px;"></div>
                </div>
                <div class="row">
                    <div class="col-12 bg-warning" style="height: 60px;"></div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-6 bg-primary" style="height: 120px;"></div>
            <div class="col-6">
                <div class="row">
                    <div class="col-12 bg-success" style="height: 60px;"></div>
                    <div class="col-12 bg-warning" style="height: 60px;"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
