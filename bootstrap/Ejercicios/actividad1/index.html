<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>TARJETAS AGRUPADAS CON CARDGROUP</h1> 
        <div class="row">
            
        </div>
        <div class="card-group">
            <div class="card">
                <img src="https://farm6.staticflickr.com/5695/21138069916_7053475939_b.jpg" class="card-img-top" alt="feria">
                <div class="card-body">
                    <h5 class="card-title">Primer Titulo</h5>
                    <p class="card-text">Aqui ponemos una descripcion mas extensa de la tarjeta para forzar que la altura de a caja se autoajuste al modo Flexbox.</p>
                </div>
                <div class="card-footer">
                    <small class="text-body-secondary">Lugar del pie primero</small>
                </div>
            </div>
            <div class="card">
                <img src="https://live.staticflickr.com/7210/6972482027_3312f5acea_b.jpg" class="card-img-top" alt="feria">
                <div class="card-body">
                    <h5 class="card-title">Segundo Titulo</h5>
                    <p class="card-text">Aqui ponemos una descripcion mas cortita de la tarjeta</p>
                </div>
                <div class="card-footer">
                    <small class="text-body-secondary">Lugar del pie Segundo</small>
            </div>
         </div>
        </div>
        
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
