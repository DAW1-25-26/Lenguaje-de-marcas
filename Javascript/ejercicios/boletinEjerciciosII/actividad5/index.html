<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>EJ5</title>
        <style>
            body{
                background-color: beige;
            }
          button {
            background-color: #b3b0d6;
            padding: 15px 40px;
            border: 2px solid black;
            cursor: pointer;
            }
            .Principal{
            background-color: gray;
            font-size: 40px;
            text-align: center;
            }
        </style>
    </head>
    <body>
        <h1 class="Principal">Crea un título y 2 secciones</h1>
        <hr>
        <form>
            <br>
       
            <h1 id="mostrarTitulo">Título: </h1>
            <h2 id="mostrarSeccion1">Sección 1: </h2>
            <p id="mostrarParrafo1"></p>
            <h2 id="mostrarSeccion2">Sección 2: </h2>
            <p id="mostrarParrafo2"></p>


           
            <h1>Introduce el título:</h1>
            <textarea id="titulo"></textarea>


            <h2>Introduce la sección 1:</h2>
            <textarea id="seccion1"></textarea>


            <h3>Introduce el párrafo de la sección 1:</h3>
            <textarea id="ParrafoSeccion1"></textarea>


            <h2>Introduce la sección 2:</h2>
            <textarea id="seccion2"></textarea>


            <h3>Introduce el párrafo de la sección 2:</h3>
            <textarea id="ParrafoSeccion2"></textarea>
            <br><br>


            <button type="button" id="btn">Rellenar información</button>


        </form>


        <script src="script.js"></script>


    </body>
</html>
