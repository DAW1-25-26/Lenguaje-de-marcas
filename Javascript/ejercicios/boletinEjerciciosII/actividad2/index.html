<html>
    <head>
        <title>Actividad 2</title>
        <meta charset="UTF-8">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="script.js"></script>
    </head>
    <body>
        <div class="container mx-0 mt-2">
            <h1 id="titulo">Escribe el titulo</h1>
            <div class="pt-3">
                <form id="formulario">
                    <p>Puedes modificar el título, poniendo el nuevo titulo en el campo de texto y pulsando el boton cambiar titulo</p>
                    <textarea class="form-control" id="titulot" rows="2" cols="1" placeholder="Título..." style="border: solid black 2px;width: 600px;"></textarea>
                    <button type="button" class="mt-2" style="border:solid black 1px;" id="boton">Cambiar titulo</button>
                </form>
            </div>
        </div>
    </body>
</html>
